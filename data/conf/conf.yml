solvers:
  Z3Str3:
    binary: /home/mku/tools/z3/bin/z3
  Z3Seq:
    binary: /home/mku/tools/z3/bin/z3
  CVC5:
    binary: /home/mku/tools/cvc5/bin/cvc5
  CVC4:
    binary: /usr/bin/cvc4 
  Ostrich:
    binary: /home/mku/tools/ostrich/ostrich
  Z3Noodler:
    binary: /home/mku/tools/noodler/build/z3
verifiers: [Z3Seq]

runParameters:
  timeout : 20 

SMTStore:
  name: DBFS
  root: data/smtfiles
  engine_string: mariadb+mariadbconnector://smtquerydb:password@127.0.0.1:3306/smtquery
  intels:
    - Probes

scheduler:
  name: multiprocessing
  cores: 120

outputlocation: output
